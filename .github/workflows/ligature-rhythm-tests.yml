name: ligature-rhythm tests
on:
  push:
    paths: ['ligature-rhythm/**', '.github/workflows/ligature-rhythm-tests.yml']
  pull_request:
    paths: ['ligature-rhythm/**']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    defaults:
      run:
        working-directory: ligature-rhythm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest -q
