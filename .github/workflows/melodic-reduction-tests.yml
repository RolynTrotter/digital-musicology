name: melodic-reduction and schenker-graph tests
on:
  push:
    paths: ['melodic-reduction/**', 'schenker-graph/**', '.github/workflows/melodic-reduction-tests.yml']
  pull_request:
    paths: ['melodic-reduction/**', 'schenker-graph/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y libcairo2
      - run: pip install -e 'melodic-reduction[test]' -e 'schenker-graph[test]'
      - run: cd melodic-reduction && pytest -q
      - run: cd schenker-graph && pytest -q
