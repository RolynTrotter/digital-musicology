[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ligature-rhythm"
version = "0.2.0"
description = "Realise the rhythm of Notre-Dame modal notation (CANDR MEI ligatures) and write MusicXML"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.5"]
authors = [{name = "Alex Bean"}]
keywords = ["musicology", "notre dame", "modal rhythm", "clausula", "MEI", "MusicXML", "CANDR"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
render = ["verovio", "cairosvg"]
test = ["pytest>=7"]

[project.scripts]
ligature-rhythm = "ligature_rhythm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ligature_rhythm = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
